# Source adapter configurations.
#
# Mirrors the adapters registered in src/aap_watcher/scrapers/sources.py and
# sources_catalog.py. `enabled` controls whether a source is scraped by default
# (run/monitor "all"); `requests_per_second` is the per-source polite rate limit
# (default 0.5 from BaseScraper); `respect_robots_txt` gates robots.txt checks.
#
# Add a new source here AND register it in sources.py with a fixture + test.

sources:
  - name: anr
    key: anr
    listing_url: "https://anr.fr/fr/appels-a-projets/"
    enabled: true

  - name: inca
    key: inca
    listing_url: "https://www.cancer.fr/professionnels-de-la-recherche/appels-a-projets-et-a-candidatures/nos-appels-a-projets"
    enabled: true

  - name: ars
    key: ars
    listing_url: "https://www.ars.sante.fr/liste-appels-projet-candidature-nationale"
    enabled: true

  - name: fondation_arc
