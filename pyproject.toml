[project]
name = "aap-watcher"
version = "0.1.0"
description = "Monitor, extract and benchmark Appels à Projets (AAP) from French/European funding organisations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
spacy = [
    "spacy>=3.7",
]
transformers = [
    "torch>=2.0",
    "transformers>=4.40",
]
llm = [
    "openai>=1.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
aap-watcher = "aap_watcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aap_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
